[package]
name = "hdmi-hal-async"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "MPL-2.0"
description = "Async hardware abstraction traits for the HDMI stack"
repository = "https://github.com/ashlar-display/hdmi-hal-async"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "hal", "async"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc", "asynchronous"]

[dependencies]
hdmi-hal = { version = "0.6", default-features = false }
display-types = { version = "0.4", default-features = false }

[dev-dependencies]
pollster = { version = "0.3", features = ["macro"] }
