[package]
name = "hdmi-hal-async"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "MPL-2.0"
description = "Async hardware abstraction traits for the HDMI stack"
repository = "https://github.com/DracoWhitefire/hdmi-hal-async"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "hal", "async"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc", "asynchronous"]

[dependencies]
hdmi-hal = { version = "0.5.1", default-features = false }
display-types = { version = "0.4", default-features = false }

[dev-dependencies]
pollster = { version = "0.3", features = ["macro"] }

# Temporary, until hdmi-hal with the required `read_block` is published (0.6; the
# requirement above becomes "0.6" then): replaces it for the whole graph, so this crate is
# tested against the hdmi-hal it will be released with. Remove before merging.
[patch.crates-io]
hdmi-hal = { path = "../hdmi-hal" }
